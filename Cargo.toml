[package]
name = "ntime"
description = "NanoTime is a lightweight, high performance Rust library for nanosecond-precision timestamps."
version = "1.0.0"
authors = ["Lisandro Pin <lisandrop@proton.me>"]
categories = ["date-and-time"]
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
keywords = ["duration", "time", "timestamp"]
repository = "https://github.com/plisandro/ntime"
rust-version = "1.85.0"

include = [
  "Cargo.toml",
  "LICENSE*",
  "src/**/*",
]

[lints.rust]
warnings = "deny"

[lib]
name = "ntime"
path = "src/lib.rs"

[dependencies]
# no external dependencies FTW

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "casting"
harness = false

[[bench]]
name = "formatting"
harness = false
